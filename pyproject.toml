[build-system]
requires = [
    "setuptools>=61",
    "Cython>=3.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "amun-robot"
version = "0.1.3"
description = "Educational robot world for learning programming in Python"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.10.2",
    "websockets==16.0",
    "qtawesome==1.4.1",
]

[tool.setuptools]
py-modules = ["amun", "gui"]

[tool.setuptools.packages.find]
include = ["client", "client.*", "gui", "gui.*", "server", "server.*"]